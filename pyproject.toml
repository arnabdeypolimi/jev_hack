[project]
name = "pushcube"
version = "0.1.0"
description = "Push-Cube: a human races TypeSafe's Jev to push a cube onto a goal."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "httpx",
    "pymunk",
    "uvicorn[standard]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pushcube"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[dependency-groups]
dev = [
    "numpy",
    "pytest",
    "pytest-asyncio",
]

[tool.uv]
exclude-newer = "2026-11-03T00:00:00Z"
